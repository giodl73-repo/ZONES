# Local tracker repo map for generated Cargo dependency overrides.
# Cargo does not read this file directly; run:
#
#   python tools\repo_map.py write-cargo-config
#

[standard]
version = 1
cargo_config = ".cargo/config.toml"

[repos.this_repo]
role = "current repository"
relative = "."
clone_url = "https://github.com/giodl73-repo/ZONES.git"

[repos.rline]
role = "tracker dependency for zones"
relative = "..\\..\\tools-infra\\rline"
clone_url = "https://github.com/giodl73-repo/RLINE.git"
cargo_patches = [
  { package = "rgraph-core", source = "https://github.com/giodl73-repo/RLINE", path = "crates/rgraph-core" },
]

[repos.rplan]
role = "tracker dependency for zones"
relative = "..\\..\\election-systems\\rplan"
clone_url = "https://github.com/giodl73-repo/RPLAN.git"
cargo_patches = [
  { package = "rplan-core", source = "https://github.com/giodl73-repo/RPLAN", path = "crates/rplan-core" },
]
