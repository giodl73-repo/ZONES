name: Civil-time workbench
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned tools
        timeout-minutes: 5
        run: |
          rustup show
          mkdir -p .cache/bindgen
          curl --fail --location --retry 2 --max-time 60 https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz -o .cache/bindgen.tar.gz
          echo '61d4a7dc85acfa0d2354ccc0b8361928c7e52a746d17f28ebaa795ed3dc1614a  .cache/bindgen.tar.gz' | sha256sum --check
          tar -xzf .cache/bindgen.tar.gz -C .cache/bindgen --strip-components=1
          echo "$PWD/.cache/bindgen" >> "$GITHUB_PATH"
          npm ci --fetch-retries=1 --fetch-timeout=60000
          npx playwright install chromium
      - name: Validate Rust
        run: |
          cargo fmt --all --check
          cargo check --locked --workspace --all-targets
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p zones-web --lib --features wasm --target wasm32-unknown-unknown -- -D warnings
      - name: Build Pages and test browser
        run: |
          python tools/build-pages.py
          npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ZONES
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
