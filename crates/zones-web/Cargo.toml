[package]
name = "zones-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
[lib]
crate-type = ["rlib", "cdylib"]
[features]
wasm = ["dep:wasm-bindgen"]
[dependencies]
zones-core = { path = "../zones-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.129", optional = true }
